<!DOCTYPE html>
<html>
<head>
    <title>Profit Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            width: 400px;
            box-sizing: border-box;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 10px;
        }

        label {
            font-size: 12px;
            margin-bottom: 2px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 6px;
            font-size: 14px;
        }

        input[readonly] {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        button {
            margin-top: 10px;
            padding: 6px;
            font-size: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            min-width: 100px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<h3>Profit Calculator</h3>
<div class="form-grid">
    <div class="form-group">
        <label for="retail">Retail Price</label>
        <input id="retail" type="number"/>
    </div>
    <div class="form-group">
        <label for="margin">Chassis Margin Target</label>
        <input id="margin" type="number" value="1500"/>
    </div>

    <div class="form-group">
        <label for="position">Price Position %</label>
        <input id="position" type="number" value="100"/>
    </div>

    <div class="form-group">
        <label for="commissionRate">Finance Commission Rate %</label>
        <input id="commissionRate" type="number" value="0"/>
    </div>

    <div class="form-group">
        <label for="costs">Costs</label>
        <input id="costs" type="number" value="250"/>
    </div>


    <div class="form-group">
        <label for="commission">Finance Commission</label>
        <input id="commission" type="number" readonly/>
    </div>

    <div class="form-group">
        <label for="result">Max Purchase Price</label>
        <input type="text" id="result" readonly/>
    </div>

    <div class="form-group">
        <label for="totalMargin">Total Potential Margin</label>
        <input type="text" id="totalMargin" readonly/>
    </div>
</div>
<button id="saveBtn">Save as PDF</button>
<script src="jspdf.umd.min.js"></script>

<script type="module" src="popup.js"></script>
</body>
</html>
