<!DOCTYPE html>
<html>
<head>
    <title>Profit Calculator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: row-reverse;
            width: 500px;
            height: 650px;
            /*overflow: hidden;*/
        }

        .sidebar {
            width: 50px;
            background-color: #0a0a23;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            flex-shrink: 0;
        }

        .sidebar i {
            font-size: 20px;
            margin: 20px 0;
            cursor: pointer;
            color: #ccc;
        }

        .sidebar i.active {
            color: #fff;
            background-color: #16213e;
            padding: 6px;
            border-radius: 8px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: #f8f9fc;
            /*overflow-y: auto;*/
        }

        .tab-content {
            display: none;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        .section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-group input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .results {
            background: white;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
        }

        .results .line {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .results .line.total {
            font-weight: bold;
            color: green;
            border-top: 1px solid #ddd;
            margin-top: 10px;
            padding-top: 10px;
        }

        .footer-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .footer-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-save {
            background-color: #0d6efd;
            color: white;
        }

        .btn-new {
            background-color: #f1f1f1;
        }

        .btn-pdf {
            background-color: #28a745;
            color: white;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }

        .card-controls button {
            padding: 2px 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <i class="fas fa-calculator active" data-tab="calc" title="Calculator"></i>
    <i class="fas fa-pound-sign" data-tab="expenses" title="Expenses"></i>
    <i class="fas fa-pound-sign" data-tab="expenses" title="Expenses"></i>
    <i class="fas fa-pound-sign" data-tab="expenses" title="Expenses"></i>
    <i class="fas fa-pound-sign" data-tab="expenses" title="Expenses"></i>
    <i class="fas fa-pound-sign" data-tab="expenses" title="Expenses"></i>
    <i class="fas fa-pound-sign" data-tab="expenses" title="Expenses"></i>
</div>

<!-- Main Container -->
<div class="container">
    <!-- Calculator Tab -->
    <div id="tab-calc" class="tab-content active">
        <h2>Profit Calculator</h2>
        <div class="section">
            <div class="form-group"><label>Registration</label><input type="text"/></div>
            <div class="form-group"><label>Miles</label><input type="text"/></div>
            <div class="form-group"><label>Retail Price</label><input type="number"/></div>
            <div class="form-group"><label>Price Position (%)</label><input type="number"/></div>
            <div class="form-group"><label>Vehicle Margin Target</label><input type="number"/></div>
            <div class="form-group"><label>Max Purchase Price</label><input type="text" readonly/></div>
            <div class="form-group"><label>MOT Expiry</label><input type="text"/></div>
            <div class="form-group"><label>Auction Date</label><input type="date"/></div>
        </div>

        <div class="results">
            <div class="line"><span>Gross Margin:</span><span>£0</span></div>
            <div class="line"><span>VAT (16.66%):</span><span>£0</span></div>
            <div class="line"><span>Total Expenses:</span><span>£0</span></div>
            <div class="line"><span>Vehicle Margin:</span><span>£0</span></div>
            <div class="line"><span>Net Margin:</span><span>£0</span></div>
            <div class="line"><span>Finance Commission:</span><span>£0</span></div>
            <div class="line total"><span>Total Potential Margin:</span><span>£0</span></div>
        </div>

        <div class="footer-buttons">
            <button class="btn-new">+ New</button>
            <button class="btn-save">Save</button>
            <button class="btn-pdf">PDF</button>
        </div>
    </div>

    <!-- Expenses Tab -->
    <div id="tab-expenses" class="tab-content">
        <h2>Manual Expenses</h2>
        <div class="form-group"><label>Paint</label><input type="number" value="0"/></div>
        <div class="form-group"><label>Mechanical</label><input type="number" value="0"/></div>
        <div class="form-group"><label>Transport</label><input type="number" value="0"/></div>
        <div class="form-group"><label>Miscellaneous</label><input type="number" value="0"/></div>

        <h3>Select Saved Expenses</h3>
        <div class="card">
            <div class="card-title">Black Alloys <span style="float:right">£250 per unit</span></div>
            <div class="card-controls">
                <button>-</button>
                <input type="number" value="0" style="width: 40px;"/>
                <button>+</button>
                <span style="margin-left:auto;">Total: £0</span>
            </div>
        </div>


        <div class="footer-buttons">
            <button class="btn-new">+ New</button>
            <button class="btn-save">Save</button>
            <button class="btn-pdf">PDF</button>
        </div>
    </div>
</div>

<script>
    const tabs = document.querySelectorAll('.sidebar i');
    const contents = document.querySelectorAll('.tab-content');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            // Remove active from all
            tabs.forEach(i => i.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));

            // Add active to current
            tab.classList.add('active');
            const id = tab.getAttribute('data-tab');
            document.getElementById('tab-' + id).classList.add('active');
        });
    });
</script>

</body>
</html>
